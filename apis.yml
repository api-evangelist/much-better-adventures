name: Much Better Adventures
description: Much Better Adventures is a B Corp certified adventure travel company that runs 250+
  solo-friendly, expert-led outdoor group trips across the world's trails, rivers, coasts and mountains,
  matching travellers with certified local guides and hosts. It is a consumer-facing booking platform
  with financial protection via ABTOT/ABTA/ATOL and contributes 5% of every booking to its foundation
  for conservation. Surfaced as a Seedcamp portfolio company and added to the API Evangelist network;
  an enrichment pass found no public API, developer portal, or machine-readable API surface.
